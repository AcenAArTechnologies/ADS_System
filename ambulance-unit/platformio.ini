[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DTINY_GSM_MODEM_SIM800
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  mikalhart/TinyGPSPlus @ ^1.0.3
  vshymanskyy/TinyGSM @ ^0.11.9
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.1.0
